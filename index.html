    <!-- Script Sincronizzazione Bidirezionale Simmetrica -->
    <script>
      const BIN_ID = "6aeddafaac6210605a726c11";
      const API_KEY = "$2a$10$WwSPCntoB1jPrDMz7j7upufH2GlNnLbA6lbhSxUt8hUbSxIv0gkSe";

      const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
      const JSONBIN_HEADERS = {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      };

      let isWriting = false;
      let lastKnownHash = "";
      let lastTouchTime = 0;

      // Traccia qualsiasi interazione touch o click per proteggere le modifiche in corso
      const touchHandler = () => { lastTouchTime = Date.now(); };
      window.addEventListener("touchstart", touchHandler, { passive: true });
      window.addEventListener("mousedown", touchHandler, { passive: true });

      function getStorageDump() {
        const dump = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k) dump[k] = localStorage.getItem(k);
        }
        return dump;
      }

      // INVIA DATI AL CLOUD
      async function pushState() {
        const currentDump = getStorageDump();
        const strDump = JSON.stringify(currentDump);
        if (strDump === "{}" || strDump === lastKnownHash) return;

        lastKnownHash = strDump;
        isWriting = true;

        try {
          await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: JSONBIN_HEADERS,
            body: JSON.stringify({ payload: currentDump }),
            keepalive: true
          });
          console.log("⚡ Modifica inviata al Cloud!");
        } catch (e) {
          console.error("❌ Errore push:", e);
        } finally {
          setTimeout(() => { isWriting = false; }, 2000);
        }
      }

      // RICEVE DATI DAL CLOUD
      async function pullState() {
        // Se stiamo scrivendo o se l'utente ha toccato lo schermo negli ultimi 4 secondi, non sovrascrivere
        if (isWriting || (Date.now() - lastTouchTime < 4000)) return;

        try {
          const res = await fetch(JSONBIN_URL + "/latest?t=" + Date.now(), { headers: JSONBIN_HEADERS });
          if (!res.ok) return;
          const data = await res.json();

          if (data && data.record && data.record.payload) {
            const remoteStorage = data.record.payload;
            const strRemote = JSON.stringify(remoteStorage);

            if (strRemote !== lastKnownHash && strRemote !== "{}") {
              let updated = false;

              Object.keys(remoteStorage).forEach(k => {
                if (localStorage.getItem(k) !== remoteStorage[k]) {
                  localStorage.setItem(k, remoteStorage[k]);
                  updated = true;
                }
              });

              if (updated) {
                lastKnownHash = strRemote;
                console.log("🔄 Rilevate nuove modifiche dal cloud, aggiornamento in corso...");
                window.location.reload();
              }
            }
          }
        } catch (e) {
          console.error("❌ Errore pull:", e);
        }
      }

      // Intercetta setItem per inviare immediatamente ogni modifica
      const originalSetItem = localStorage.setItem;
      let pushDebounce = null;

      localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (!isWriting) {
          lastTouchTime = Date.now();
          clearTimeout(pushDebounce);
          pushDebounce = setTimeout(pushState, 200);
        }
      };

      // Avvio controlli
      pullState();
      setInterval(pullState, 3000);

      // Sincronizzazione al cambio stato/scheda
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") pushState();
        if (document.visibilityState === "visible") pullState();
      });
      window.addEventListener("pagehide", pushState);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" crossorigin src="./index-v-hcNyMY.js"></script>
  </body>
</html>
