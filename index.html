    <link rel="manifest" href="./manifest.json" />

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- CSS Locale -->
    <link rel="stylesheet" crossorigin href="./index-C7v-s4oy.css">

    <!-- Script Sincronizzazione Universale JSONBin -->
    <script>
      const BIN_ID = "6aeddafaac6210605a726c11";
      const API_KEY = "$2a$10$WwSPCntoB1jPrDMz7j7upufH2GlNnLbA6lbhSxUt8hUbSxIv0gkSe";

      const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
      const JSONBIN_HEADERS = {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      };

      let isSyncing = false;
      let lastSentSnapshot = "";

      // Estrae tutto ciò che l'app salva in LocalStorage
      function getLocalStateDump() {
        const dump = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k) dump[k] = localStorage.getItem(k);
        }
        return dump;
      }

      // 1. INVIO TUTTI I DATI AL CLOUD
      async function pushToCloud() {
        if (isSyncing) return;
        const stateDump = getLocalStateDump();
        const strDump = JSON.stringify(stateDump);
        if (strDump === "{}" || strDump === lastSentSnapshot) return;

        try {
          isSyncing = true;
          const res = await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: JSONBIN_HEADERS,
            body: strDump
          });
          if (res.ok) {
            lastSentSnapshot = strDump;
            console.log("✅ Stato completo salvato sul Cloud!");
          }
        } catch (e) {
          console.error("❌ Errore invio cloud:", e);
        } finally {
          setTimeout(() => { isSyncing = false; }, 1000);
        }
      }

      // 2. SCARICA I DATI DAL CLOUD
      async function pullFromCloud() {
        if (isSyncing) return;
        try {
          const res = await fetch(JSONBIN_URL + "/latest?t=" + Date.now(), { headers: JSONBIN_HEADERS });
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.record) {
            const remoteDump = data.record;
            const remoteStr = JSON.stringify(remoteDump);

            if (remoteStr !== lastSentSnapshot && remoteStr !== "{}" && !remoteDump.tracker) {
              let updated = false;
              Object.keys(remoteDump).forEach(k => {
                if (localStorage.getItem(k) !== remoteDump[k]) {
                  localStorage.setItem(k, remoteDump[k]);
                  updated = true;
                }
              });

              if (updated) {
                lastSentSnapshot = remoteStr;
                console.log("🔄 Ricevuto aggiornamento dal Cloud, ricarico la vista...");
                window.location.reload();
              }
            }
          }
        } catch (e) {
          console.error("❌ Errore lettura cloud:", e);
        }
      }

      // Intercetta QUALSIASI modifica o salvataggio fatto dall'app
      const originalSetItem = localStorage.setItem;
      let pushTimeout = null;

      localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (!isSyncing) {
          clearTimeout(pushTimeout);
          pushTimeout = setTimeout(pushToCloud, 400);
        }
      };

      // Controllo immediato all'apertura
      pullFromCloud();

      // Controllo periodico ogni 3 secondi per catturare le modifiche dell'altro dispositivo
      setInterval(pullFromCloud, 3000);

      // Invia subito i dati se l'utente sta per chiudere o cambiare scheda dal telefono
      window.addEventListener("pagehide", pushToCloud);
      window.addEventListener("blur", pushToCloud);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") pushToCloud();
        if (document.visibilityState === "visible") pullFromCloud();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" crossorigin src="./index-v-hcNyMY.js"></script>
  </body>
</html>
