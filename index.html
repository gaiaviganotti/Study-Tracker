    <link rel="manifest" href="./manifest.json" />

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- CSS Locale -->
    <link rel="stylesheet" crossorigin href="./index-C7v-s4oy.css">

    <!-- Script Sincronizzazione Bidirezionale con Protezione Scrittura -->
    <script>
      const BIN_ID = "6aeddafaac6210605a726c11";
      const API_KEY = "$2a$10$WwSPCntoB1jPrDMz7j7upufH2GlNnLbA6lbhSxUt8hUbSxIv0gkSe";

      const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
      const JSONBIN_HEADERS = {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      };

      let isLocalUserAction = false;
      let userActionTimer = null;
      let lastKnownHash = "";

      // Raccoglie i dati locali
      function getLocalDump() {
        const dump = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k) dump[k] = localStorage.getItem(k);
        }
        return dump;
      }

      // 1. INVIA I DATI LOCALI AL CLOUD
      async function pushToCloud() {
        const dump = getLocalDump();
        const strDump = JSON.stringify(dump);
        if (strDump === "{}" || strDump === lastKnownHash) return;

        try {
          const res = await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: JSONBIN_HEADERS,
            body: strDump
          });
          if (res.ok) {
            lastKnownHash = strDump;
            console.log("✅ Salvo le modifiche sul Cloud!");
          }
        } catch (e) {
          console.error("❌ Errore scrittura Cloud:", e);
        }
      }

      // 2. LEGGE I DATI DAL CLOUD (solo se l'utente non sta interagendo sul dispositivo)
      async function pullFromCloud() {
        if (isLocalUserAction) return; // Blocco sicurezza se stai toccando lo schermo

        try {
          const res = await fetch(JSONBIN_URL + "/latest?t=" + Date.now(), { headers: JSONBIN_HEADERS });
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.record && !data.record.tracker) {
            const remoteDump = data.record;
            const remoteStr = JSON.stringify(remoteDump);

            if (remoteStr !== lastKnownHash && remoteStr !== "{}") {
              let changed = false;
              Object.keys(remoteDump).forEach(k => {
                if (localStorage.getItem(k) !== remoteDump[k]) {
                  localStorage.setItem(k, remoteDump[k]);
                  changed = true;
                }
              });

              if (changed) {
                lastKnownHash = remoteStr;
                console.log("🔄 Nuove modifiche rilevate dall'altro dispositivo, ricarico...");
                window.location.reload();
              }
            }
          }
        } catch (e) {
          console.error("❌ Errore lettura Cloud:", e);
        }
      }

      // Intercetta i click/modifiche sul dispositivo locale
      const originalSetItem = localStorage.setItem;
      let pushDebounce = null;

      localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);

        // Segnala che l'utente ha fatto un'azione locale: blocca pull per 5 secondi
        isLocalUserAction = true;
        clearTimeout(userActionTimer);
        userActionTimer = setTimeout(() => { isLocalUserAction = false; }, 5000);

        clearTimeout(pushDebounce);
        pushDebounce = setTimeout(pushToCloud, 300);
      };

      // Avvio controlli
      pullFromCloud();
      setInterval(pullFromCloud, 4000);

      // Sincronizzazione immediata all'uscita/rientro
      window.addEventListener("pagehide", pushToCloud);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") pushToCloud();
        if (document.visibilityState === "visible") pullFromCloud();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" crossorigin src="./index-v-hcNyMY.js"></script>
  </body>
</html>
