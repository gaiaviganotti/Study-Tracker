<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Study Tracker · Tabella di marcia</title>
    <meta name="theme-color" content="#F4ACB7" />
    
    <!-- Configurazione Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Study Tracker" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- CSS Locale -->
    <link rel="stylesheet" crossorigin href="./index-C7v-s4oy.css">

    <!-- Script Sincronizzazione Anti-Crash con JSONBin -->
    <script>
      const BIN_ID = "6aeddafaac6210605a726c11";
      const API_KEY = "$2a$10$WwSPCntoB1jPrDMz7j7upufH2GlNnLbA6lbhSxUt8hUbSxIv0gkSe";

      const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
      const JSONBIN_HEADERS = {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      };

      let isWriting = false;
      let lastKnownStr = "";
      let lastUserInteraction = 0;

      // Traccia quando l'utente clicca o tocca lo schermo
      const registerTouch = () => { lastUserInteraction = Date.now(); };
      window.addEventListener("touchstart", registerTouch, { passive: true });
      window.addEventListener("mousedown", registerTouch, { passive: true });

      // Trova la chiave di salvataggio usata da React
      function detectStorageKey() {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k.includes("study") || k.includes("tracker") || k.includes("kuse") || k.includes("state"))) {
            return k;
          }
        }
        return "study_tracker_data";
      }

      // INVIA AL CLOUD
      async function pushState() {
        const key = detectStorageKey();
        const val = localStorage.getItem(key);
        if (!val || val === lastKnownStr) return;

        lastKnownStr = val;
        isWriting = true;

        try {
          await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: JSONBIN_HEADERS,
            body: JSON.stringify({ payload: val }),
            keepalive: true
          });
          console.log("⚡ Modifica salvata sul Cloud!");
        } catch (e) {
          console.error("❌ Errore push:", e);
        } finally {
          setTimeout(() => { isWriting = false; }, 2000);
        }
      }

      // LEGGE DAL CLOUD
      async function pullState() {
        // Se stiamo scrivendo o se l'utente ha toccato lo schermo negli ultimi 5 sec, non ricaricare
        if (isWriting || (Date.now() - lastUserInteraction < 5000)) return;

        try {
          const res = await fetch(JSONBIN_URL + "/latest?t=" + Date.now(), { headers: JSONBIN_HEADERS });
          if (!res.ok) return;
          const data = await res.json();

          if (data && data.record && data.record.payload) {
            const remoteVal = data.record.payload;
            const key = detectStorageKey();

            if (remoteVal && remoteVal !== localStorage.getItem(key) && remoteVal !== lastKnownStr) {
              lastKnownStr = remoteVal;
              localStorage.setItem(key, remoteVal);
              console.log("🔄 Dati aggiornati dal Cloud!");
              window.location.reload();
            }
          }
        } catch (e) {
          console.error("❌ Errore pull:", e);
        }
      }

      // Intercetta la scrittura locale di React
      const originalSetItem = localStorage.setItem;
      localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (!isWriting && (key.includes("study") || key.includes("tracker") || key.includes("kuse") || key.includes("state"))) {
          lastUserInteraction = Date.now();
          pushState();
        }
      };

      // Avvio
      pullState();
      setInterval(pullState, 4000);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") pushState();
        if (document.visibilityState === "visible") pullState();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" crossorigin src="./index-v-hcNyMY.js"></script>
  </body>
</html>
