    <!-- Script Sincronizzazione Universale Anti-Crash -->
    <script>
      const BIN_ID = "6aeddafaac6210605a726c11";
      const API_KEY = "$2a$10$WwSPCntoB1jPrDMz7j7upufH2GlNnLbA6lbhSxUt8hUbSxIv0gkSe";

      const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
      const JSONBIN_HEADERS = {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      };

      let isWriting = false;
      let lastSentHash = "";
      let lastInteractionTime = 0;

      const trackTouch = () => { lastInteractionTime = Date.now(); };
      window.addEventListener("touchstart", trackTouch, { passive: true });
      window.addEventListener("mousedown", trackTouch, { passive: true });

      // Crea uno snapshot di tutto il localStorage
      function getStorageSnapshot() {
        const snapshot = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k) snapshot[k] = localStorage.getItem(k);
        }
        return snapshot;
      }

      // INVIA AL CLOUD
      async function pushState() {
        const currentSnapshot = getStorageSnapshot();
        const strSnapshot = JSON.stringify(currentSnapshot);
        if (strSnapshot === "{}" || strSnapshot === lastSentHash) return;

        lastSentHash = strSnapshot;
        isWriting = true;

        try {
          await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: JSONBIN_HEADERS,
            body: JSON.stringify({ payload: currentSnapshot }),
            keepalive: true
          });
          console.log("⚡ Sincronizzato con il Cloud!");
        } catch (e) {
          console.error("❌ Errore push:", e);
        } finally {
          setTimeout(() => { isWriting = false; }, 1500);
        }
      }

      // LEGGE DAL CLOUD
      async function pullState() {
        // Blocco sicurezza: se stai scrivendo o hai toccato lo schermo negli ultimi 5 secondi, non interrompere l'utente
        if (isWriting || (Date.now() - lastInteractionTime < 5000)) return;

        try {
          const res = await fetch(JSONBIN_URL + "/latest?t=" + Date.now(), { headers: JSONBIN_HEADERS });
          if (!res.ok) return;
          const data = await res.json();

          if (data && data.record && data.record.payload) {
            const remoteStorage = data.record.payload;
            const strRemote = JSON.stringify(remoteStorage);

            if (strRemote !== lastSentHash && strRemote !== "{}") {
              let hasChanges = false;

              Object.keys(remoteStorage).forEach(key => {
                if (localStorage.getItem(key) !== remoteStorage[key]) {
                  localStorage.setItem(key, remoteStorage[key]);
                  hasChanges = true;
                }
              });

              if (hasChanges) {
                lastSentHash = strRemote;
                console.log("🔄 Nuovi dati ricevuti dall'altro dispositivo, aggiorno la pagina...");
                window.location.reload();
              }
            }
          }
        } catch (e) {
          console.error("❌ Errore pull:", e);
        }
      }

      // Intercetta qualsiasi scrittura locale
      const originalSetItem = localStorage.setItem;
      let pushDebounce = null;

      localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (!isWriting) {
          lastInteractionTime = Date.now();
          clearTimeout(pushDebounce);
          pushDebounce = setTimeout(pushState, 300);
        }
      };

      // Avvio controlli
      pullState();
      setInterval(pullState, 3000);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") pushState();
        if (document.visibilityState === "visible") pullState();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" crossorigin src="./index-v-hcNyMY.js"></script>
  </body>
