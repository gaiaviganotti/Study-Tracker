    <script>
      const BIN_ID = "6aeddafaac6210605a726c11";
      const API_KEY = "$2a$10$WwSPCntoB1jPrDMz7j7upufH2GlNnLbA6lbhSxUt8hUbSxIv0gkSe";

      const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
      const JSONBIN_HEADERS = {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      };

      let isWriting = false;
      let lastPayload = "";
      let lastTouchTime = 0;

      window.addEventListener("touchstart", () => { lastTouchTime = Date.now(); }, { passive: true });
      window.addEventListener("click", () => { lastTouchTime = Date.now(); }, { passive: true });

      // Trova la chiave principale usata dall'app React
      function getAppKey() {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k.includes("study") || k.includes("tracker") || k.includes("kuse") || k.includes("state"))) {
            return k;
          }
        }
        return "study_tracker_data";
      }

      // INVIA AL CLOUD
      async function pushState() {
        const key = getAppKey();
        const rawVal = localStorage.getItem(key);
        if (!rawVal || rawVal === lastPayload) return;

        let dataToSave;
        try {
          dataToSave = JSON.parse(rawVal);
        } catch(e) {
          dataToSave = { raw: rawVal };
        }

        lastPayload = rawVal;
        isWriting = true;

        try {
          await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: JSONBIN_HEADERS,
            body: JSON.stringify(dataToSave),
            keepalive: true
          });
          console.log("⚡ Dati inviati al Cloud!");
        } catch (e) {
          console.error("❌ Errore push:", e);
        } finally {
          setTimeout(() => { isWriting = false; }, 2000);
        }
      }

      // LEGGE DAL CLOUD
      async function pullState() {
        if (isWriting || (Date.now() - lastTouchTime < 6000)) return;

        try {
          const res = await fetch(JSONBIN_URL + "/latest?t=" + Date.now(), { headers: JSONBIN_HEADERS });
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.record && !data.record.tracker) {
            const key = getAppKey();
            const remoteVal = data.record.raw ? data.record.raw : JSON.stringify(data.record);

            if (remoteVal !== localStorage.getItem(key) && remoteVal !== lastPayload) {
              lastPayload = remoteVal;
              localStorage.setItem(key, remoteVal);
              console.log("🔄 Nuovi dati ricevuti, ricarico la vista...");
              window.location.reload();
            }
          }
        } catch (e) {
          console.error("❌ Errore pull:", e);
        }
      }

      // Intercetta la scrittura locale senza bloccare l'interfaccia
      const originalSetItem = localStorage.setItem;
      localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (!isWriting && (key.includes("study") || key.includes("tracker") || key.includes("kuse") || key.includes("state"))) {
          lastTouchTime = Date.now();
          pushState();
        }
      };

      pullState();
      setInterval(pullState, 4000);
