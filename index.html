    <!-- Script di Sincronizzazione Supabase Corretto -->
    <script>
      const SUPABASE_APIKEY = "sb_publishable_VbPPg_DTf7RVWJrP7wJp9w_Q5zubVps";
      const SUPABASE_URL = "https://fgimdeizmnywxkrvqgbt.supabase.co/rest/v1/widget_snapshots?id=eq.4o2g2m3z4p6k315n313i514c0m4b371i";
      
      const SUPABASE_HEADERS = {
        "apikey": SUPABASE_APIKEY,
        "Authorization": "Bearer " + SUPABASE_APIKEY,
        "Content-Type": "application/json"
      };

      // 1. CARICAMENTO DATI ALL'AVVIO
      (async function syncOnLoad() {
        try {
          const res = await fetch(SUPABASE_URL + "&select=data", { headers: SUPABASE_HEADERS });
          if (!res.ok) {
            console.error("❌ Errore HTTP Lettura:", res.status);
            return;
          }
          const rows = await res.json();
          if (rows && rows[0] && rows[0].data) {
            const dataObj = rows[0].data;
            const dataStr = JSON.stringify(dataObj);
            
            Object.keys(localStorage).forEach(key => {
              if (key.includes("study") || key.includes("tracker") || key.includes("kuse") || key.includes("state")) {
                localStorage.setItem(key, dataStr);
              }
            });
            if (localStorage.length === 0) {
              localStorage.setItem("study_tracker_data", dataStr);
            }
            console.log("✅ Dati caricati con successo da Supabase!");
          }
        } catch (e) {
          console.error("❌ Errore sync lettura Supabase:", e);
        }
      })();

      // 2. SALVATAGGIO AUTOMATICO AD OGNI MODIFICA
      const originalSetItem = localStorage.setItem;
      let syncTimeout = null;

      localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        
        if (key && (key.includes("study") || key.includes("tracker") || key.includes("kuse") || key.includes("state"))) {
          clearTimeout(syncTimeout);
          syncTimeout = setTimeout(async () => {
            try {
              let parsedData = typeof value === "string" ? JSON.parse(value) : value;
              const response = await fetch(SUPABASE_URL, {
                method: "PATCH",
                headers: SUPABASE_HEADERS,
                body: JSON.stringify({ data: parsedData })
              });
              if (response.ok) {
                console.log("✅ Dati inviati a Supabase!");
              } else {
                console.error("❌ Errore scrittura Supabase:", response.status);
              }
            } catch (e) {
              console.error("❌ Errore invio Supabase:", e);
            }
          }, 400);
        }
      };
    </script>
  </head>
