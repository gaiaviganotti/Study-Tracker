    <!-- Script Sincronizzazione Istantanea Immediata -->
    <script>
      const BIN_ID = "6aeddafaac6210605a726c11";
      const API_KEY = "$2a$10$WwSPCntoB1jPrDMz7j7upufH2GlNnLbA6lbhSxUt8hUbSxIv0gkSe";

      const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
      const JSONBIN_HEADERS = {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      };

      let isWriting = false;
      let lastHash = "";
      let lastTouchTime = 0;

      // Traccia le interazioni touch sul telefono per bloccare il reload improvviso
      window.addEventListener("touchstart", () => { lastTouchTime = Date.now(); }, { passive: true });
      window.addEventListener("click", () => { lastTouchTime = Date.now(); }, { passive: true });

      function getAppState() {
        const dump = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k) dump[k] = localStorage.getItem(k);
        }
        return dump;
      }

      // INVIA AL CLOUD ISTANTANEAMENTE
      async function pushState() {
        const state = getAppState();
        const strState = JSON.stringify(state);
        if (strState === "{}" || strState === lastHash) return;

        lastHash = strState;
        isWriting = true;

        try {
          await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: JSONBIN_HEADERS,
            body: strState,
            keepalive: true
          });
          console.log("⚡ Salvato su Cloud!");
        } catch (e) {
          console.error("❌ Errore push:", e);
        } finally {
          setTimeout(() => { isWriting = false; }, 2000);
        }
      }

      // LEGGE DAL CLOUD
      async function pullState() {
        // Se si è toccato lo schermo negli ultimi 6 secondi o si sta scrivendo, NON ricaricare
        if (isWriting || (Date.now() - lastTouchTime < 6000)) return;

        try {
          const res = await fetch(JSONBIN_URL + "/latest?t=" + Date.now(), { headers: JSONBIN_HEADERS });
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.record && !data.record.tracker) {
            const remoteDump = data.record;
            const remoteStr = JSON.stringify(remoteDump);

            if (remoteStr !== lastHash && remoteStr !== "{}") {
              let updated = false;
              Object.keys(remoteDump).forEach(k => {
                if (localStorage.getItem(k) !== remoteDump[k]) {
                  localStorage.setItem(k, remoteDump[k]);
                  updated = true;
                }
              });

              if (updated) {
                lastHash = remoteStr;
                console.log("🔄 Ricevuto dal Cloud, aggiornamento vista...");
                window.location.reload();
              }
            }
          }
        } catch (e) {
          console.error("❌ Errore pull:", e);
        }
      }
