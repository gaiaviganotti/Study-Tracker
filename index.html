    <!-- Script Sincronizzazione Anti-Loop Definitivo -->
    <script>
      const BIN_ID = "6aeddafaac6210605a726c11";
      const API_KEY = "$2a$10$WwSPCntoB1jPrDMz7j7upufH2GlNnLbA6lbhSxUt8hUbSxIv0gkSe";

      const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
      const JSONBIN_HEADERS = {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      };

      let isSyncing = false;
      let isInitialBoot = true;
      let lastLocalTimestamp = parseInt(localStorage.getItem("__sync_ts") || "0", 10);
      let lastDataString = "";
      let pushDebounce = null;

      setTimeout(() => { isInitialBoot = false; }, 2000);

      function getStorageDump() {
        const dump = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k !== "__sync_ts") dump[k] = localStorage.getItem(k);
        }
        return dump;
      }

      // SALVATAGGIO SUL CLOUD
      async function pushState() {
        if (isSyncing || isInitialBoot) return;
        
        const dump = getStorageDump();
        const currentDataString = JSON.stringify(dump);

        if (currentDataString === "{}" || currentDataString === lastDataString) return;

        const now = Date.now();
        lastLocalTimestamp = now;
        localStorage.setItem("__sync_ts", now.toString());
        lastDataString = currentDataString;
        isSyncing = true;

        const payload = {
          updatedAt: now,
          data: dump
        };

        try {
          await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: JSONBIN_HEADERS,
            body: JSON.stringify(payload),
            keepalive: true
          });
          console.log("⚡ Salvato sul cloud con timestamp:", now);
        } catch (e) {
          console.error("❌ Errore scrittura:", e);
        } finally {
          setTimeout(() => { isSyncing = false; }, 800);
        }
      }

      // RICEVE DAL CLOUD
      async function pullState() {
        if (isSyncing) return;

        try {
          const res = await fetch(JSONBIN_URL + "/latest?t=" + Date.now(), { headers: JSONBIN_HEADERS });
          if (!res.ok) return;
          const remote = await res.json();

          if (remote && remote.record && remote.record.updatedAt && remote.record.data) {
            const remoteTimestamp = remote.record.updatedAt;

            // Se la prima volta non abbiamo la stringa locale, la memorizziamo senza ricaricare
            if (!lastDataString) {
              lastDataString = JSON.stringify(remote.record.data);
              if (remoteTimestamp > lastLocalTimestamp) {
                lastLocalTimestamp = remoteTimestamp;
                localStorage.setItem("__sync_ts", remoteTimestamp.toString());
              }
              return;
            }

            if (remoteTimestamp > lastLocalTimestamp) {
              const remoteData = remote.record.data;
              const remoteDataString = JSON.stringify(remoteData);

              if (remoteDataString !== lastDataString) {
                // Aggiorniamo subito il timestamp prima di sovrascrivere per bloccare il loop
                lastLocalTimestamp = remoteTimestamp;
                localStorage.setItem("__sync_ts", remoteTimestamp.toString());
                lastDataString = remoteDataString;

                Object.keys(remoteData).forEach(k => {
                  localStorage.setItem(k, remoteData[k]);
                });

                console.log("🔄 Nuovi dati ricevuti! Aggiorno...");
                window.location.reload();
              }
            }
          }
        } catch (e) {
          console.error("❌ Errore lettura cloud:", e);
        }
      }

      // Intercetta la scrittura locale
      const originalSetItem = localStorage.setItem;
      localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);
        if (key === "__sync_ts") return;
        if (!isSyncing && !isInitialBoot) {
          clearTimeout(pushDebounce);
          pushDebounce = setTimeout(pushState, 400);
        }
      };

      pullState();
      setInterval(pullState, 4000);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") pushState();
        if (document.visibilityState === "visible") pullState();
      });
