    <!-- Script Sincronizzazione Cloud Pulita (JSONBin) -->
    <script>
      const BIN_ID = "6aeddafaac6210605a726c11";
      const API_KEY = "$2a$10$WwSPCntoB1jPrDMz7j7upufH2GlNnLbA6lbhSxUt8hUbSxIv0gkSe";

      const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
      const JSONBIN_HEADERS = {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      };

      // 1. LETTURA DATI ALL'AVVIO
      (async function syncOnLoad() {
        try {
          const res = await fetch(JSONBIN_URL + "/latest", { headers: JSONBIN_HEADERS });
          if (!res.ok) {
            console.error("❌ Errore lettura cloud:", res.status);
            return;
          }
          const data = await res.json();
          if (data && data.record && Object.keys(data.record).length > 0 && !data.record.tracker) {
            const dataStr = JSON.stringify(data.record);
            Object.keys(localStorage).forEach(key => {
              if (key.includes("study") || key.includes("tracker") || key.includes("kuse") || key.includes("state")) {
                localStorage.setItem(key, dataStr);
              }
            });
            if (localStorage.length === 0) {
              localStorage.setItem("study_tracker_data", dataStr);
            }
            console.log("✅ Dati sincronizzati con successo da JSONBin!");
          }
        } catch (e) {
          console.error("❌ Errore sync lettura:", e);
        }
      })();

      // 2. SCRITTURA AUTOMATICA AD OGNI MODIFICA
      const originalSetItem = localStorage.setItem;
      let syncTimeout = null;

      localStorage.setItem = function(key, value) {
        originalSetItem.apply(this, arguments);

        if (key && (key.includes("study") || key.includes("tracker") || key.includes("kuse") || key.includes("state"))) {
          clearTimeout(syncTimeout);
          syncTimeout = setTimeout(async () => {
            try {
              let parsedData = typeof value === "string" ? JSON.parse(value) : value;
              const response = await fetch(JSONBIN_URL, {
                method: "PUT",
                headers: JSONBIN_HEADERS,
                body: JSON.stringify(parsedData)
              });
              if (response.ok) {
                console.log("✅ Modifica salvata sul Cloud!");
              } else {
                console.error("❌ Errore salvataggio cloud:", response.status);
              }
            } catch (e) {
              console.error("❌ Errore invio cloud:", e);
            }
          }, 400);
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>

  </body>
