<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Study Tracker · Tabella di marcia</title>
    <meta name="theme-color" content="#F4ACB7" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="manifest" href="./manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- CSS Locale -->
    <link rel="stylesheet" crossorigin href="./index-C7v-s4oy.css">

    <!-- Script Sync Sicuro Anti-Crash e Anti-Loop -->
    <script>
      const BIN_ID = "6aeddafaac6210605a726c11";
      const API_KEY = "$2a$10$WwSPCntoB1jPrDMz7j7upufH2GlNnLbA6lbhSxUt8hUbSxIv0gkSe";

      const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
      const JSONBIN_HEADERS = {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      };

      let isWriting = false;
      let lastLocalTimestamp = parseInt(localStorage.getItem("__tracker_ts") || "0", 10);
      let lastDataHash = "";
      let pushDebounce = null;

      function getStorageDump() {
        const dump = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k !== "__tracker_ts") {
            const v = localStorage.getItem(k);
            if (v !== null && v !== undefined) dump[k] = v;
          }
        }
        return dump;
      }

      // INVIA AL CLOUD
      async function pushState() {
        if (isWriting) return;
        
        const dump = getStorageDump();
        const currentHash = JSON.stringify(dump);

        if (currentHash === "{}" || currentHash === lastDataHash) return;

        const now = Date.now();
        lastLocalTimestamp = now;
        lastDataHash = currentHash;
        try { localStorage.setItem("__tracker_ts", now.toString()); } catch(e){}
        
        isWriting = true;

        try {
          await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: JSONBIN_HEADERS,
            body: JSON.stringify({ updatedAt: now, data: dump }),
            keepalive: true
          });
          console.log("⚡ Salvataggio Cloud completato:", now);
        } catch (e) {
          console.error("❌ Errore push:", e);
        } finally {
          setTimeout(() => { isWriting = false; }, 800);
        }
      }

      // RICEVE DAL CLOUD
      async function pullState() {
        if (isWriting) return;

        try {
          const res = await fetch(JSONBIN_URL + "/latest?t=" + Date.now(), { headers: JSONBIN_HEADERS });
          if (!res.ok) return;
          const remote = await res.json();

          if (remote && remote.record && remote.record.updatedAt && remote.record.data) {
            const remoteTimestamp = remote.record.updatedAt;

            // Inizializza l'hash locale al primo avvio per evitare reload fasulli
            if (!lastDataHash) {
              lastDataHash = JSON.stringify(getStorageDump());
            }

            if (remoteTimestamp > lastLocalTimestamp) {
              const remoteData = remote.record.data;
              const remoteHash = JSON.stringify(remoteData);

              if (remoteHash !== lastDataHash) {
                lastLocalTimestamp = remoteTimestamp;
                lastDataHash = remoteHash;
                try { localStorage.setItem("__tracker_ts", remoteTimestamp.toString()); } catch(e){}

                Object.keys(remoteData).forEach(k => {
                  try { localStorage.setItem(k, remoteData[k]); } catch(e){}
                });

                console.log("🔄 Ricevuto aggiornamento dal Cloud, ricarico la pagina...");
                window.location.reload();
              }
            }
          }
        } catch (e) {
          console.error("❌ Errore pull:", e);
        }
      }

      // Intercetta setItem in modo totalmente trasparente per React
      const originalSetItem = localStorage.setItem;
      localStorage.setItem = function(key, value) {
        try { originalSetItem.apply(this, arguments); } catch(e){}
        if (key !== "__tracker_ts" && !isWriting) {
          clearTimeout(pushDebounce);
          pushDebounce = setTimeout(pushState, 500);
        }
      };

      // Avvio controlli
      pullState();
      setInterval(pullState, 4000);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") pushState();
        if (document.visibilityState === "visible") pullState();
      });
      window.addEventListener("pagehide", pushState);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" crossorigin src="./index-v-hcNyMY.js"></script>
  </body>
</html>
